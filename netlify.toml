[build]
  publish = "."

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[redirects]]
  from = "/getsortedbeta"
  to = "https://testflight.apple.com/join/HyEvpM5S"
  status = 301
  force = true
