[build]
  publish = "."

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[redirects]]
  from = "/getsortedbeta"
  to = "https://testflight.apple.com/join/HyEvpM5S"
  status = 302
  force = true

[[redirects]]
  from = "/getsortedandroid"
  to = "https://play.google.com/apps/testing/com.brightcasa.getsorted"
  status = 302
  force = true

[[redirects]]
  from = "/noterobinbeta"
  to = "https://testflight.apple.com/join/WWrysHUG"
  status = 302
  force = true

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/noterobin/open"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/noterobin/open"
  to = "/noterobin-open.html"
  status = 200
  force = true
